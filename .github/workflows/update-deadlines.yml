name: Update Conference Deadlines

on:
  schedule:
    # 매일 UTC 18:00 (한국시간 새벽 3시)에 자동 실행
    - cron: "0 18 * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  update-deadlines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Run update script
        run: python scripts/update_deadlines.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/deadlines.yml
          if git diff --cached --quiet; then
            echo "변경 사항 없음, 커밋 생략"
          else
            git commit -m "chore: auto-update conference deadlines"
            git push
          fi
