- date: 2, August, 2025
  headline: Jeongwon and Chaeyoung were awarded an &ldquo;Encouragement Prize&rdquo; at the 2025 Korea Computer Congress.

- date: 22, July, 2025
  headline: All of our members attended the 2025 International Conference on Machine Learning held in Vancouver, Canada, and enjoyed a wonderful time.

- date: 4, July, 2025
  headline: All of our members attended the 2025 Korea Computer Congress held in Jeju, Korea, and enjoyed a memorable time thanks to Jeongwon, Chaeyoung, Heeyoung, Yeonji, Chanmi, and Minseo's works. ![Image](shiba_cover.jpg)

- date: 26, February, 2025
  headline: Prof. Ko has been awarded research grant under the New Basic Research Projects \(Outstanding Young Scientist\) program for the research titled &ldquo;Development of a unified diagnostic framework for mental disorder/brain disease through user-independent and protocol-agnostic EEG representation based on interpretable topological deep learning techniques,&rdquo; \(approximately \$400,000 over three years\).

- date: 21, February, 2025
  headline: Prof. Ko and Ms. Choe's work on &ldquo;SLEEP-SAFE: Self-supervised Learning for Estimating Electroencephalogram Patterns with Structural Analysis of Fatigue Evidence&rdquo; has been accepted for publication on IEEE Access \(JCR-IF\: 3.4; Computer Science - Information Systems 87/250\).

- date: 01, August, 2024
  headline: Prof. Ko was awarded &ldquo;Sungshin Excellent Teaching Award.&rdquo;

- date: 05, June, 2024
  headline: Prof. Ko's work on &ldquo;EEG-Oriented Self-Supervised Learning with Triple Information Pathways Network&rdquo; has been accepted for publication on IEEE Transactions on Cybernetics \(JCR-IF\: 11.8; Computer Science - Cybernetics 1/24, Computer Science - Artificial Intelligence 9/145\).

- date: 1, September, 2023
  headline: Prof. Ko joined the [School of AI Convergence, Sungshin Women's University](https://www.sungshin.ac.kr/aiot/index.do) as an assistant professor.
