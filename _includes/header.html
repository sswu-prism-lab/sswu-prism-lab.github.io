<!-- 다크 모드 토글 버튼 -->
<button id="dark-mode-toggle" style="padding: 6px 12px; background: #21262d; color: #ecf2f8; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-size: 0.85em;">
  🌙 Dark Mode
</button>

<!-- 다크 모드 작동 스크립트 -->
<script>
  const toggleBtn = document.getElementById('dark-mode-toggle');
  const currentTheme = localStorage.getItem('theme');

  // 사용자가 이전에 다크모드를 켰었다면 페이지 로드 시 바로 적용
  if (currentTheme === 'dark') {
    document.body.classList.add('dark-mode');
    toggleBtn.textContent = '☀️ Light Mode';
  }

  // 버튼 클릭 시 토글 기능
  toggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    
    let theme = 'light';
    if (document.body.classList.contains('dark-mode')) {
      theme = 'dark';
      toggleBtn.textContent = '☀️ Light Mode';
    } else {
      toggleBtn.textContent = '🌙 Dark Mode';
    }
    
    // 사용자의 선택을 저장하여 새로고침해도 유지되도록 함
    localStorage.setItem('theme', theme);
  });
</script>
