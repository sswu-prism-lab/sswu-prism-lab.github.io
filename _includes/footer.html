<!-- Dark / light theme toggle -->
<script>
  (function () {
    var root = document.documentElement;

    function setTheme(theme, persist) {
      root.setAttribute('data-theme', theme);
      if (persist) {
        try { localStorage.setItem('theme', theme); } catch (e) {}
      }
    }

    var toggle = document.getElementById('theme-toggle');
    if (toggle) {
      toggle.addEventListener('click', function (e) {
        e.preventDefault();
        var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        setTheme(current === 'dark' ? 'light' : 'dark', true);
      });
    }

    // Follow the OS setting until the user makes an explicit choice.
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function (ev) {
        var hasChoice = false;
        try { hasChoice = !!localStorage.getItem('theme'); } catch (e) {}
        if (!hasChoice) { setTheme(ev.matches ? 'dark' : 'light', false); }
      };
      if (mq.addEventListener) { mq.addEventListener('change', onChange); }
      else if (mq.addListener) { mq.addListener(onChange); }
    }
  })();
</script>

<!-- Language toggle (English / Korean) -->
<script>
  (function () {
    var root = document.documentElement;
    function setLang(lang, persist) {
      root.setAttribute('data-lang', lang);
      if (persist) { try { localStorage.setItem('lang', lang); } catch (e) {} }
    }
    var toggle = document.getElementById('lang-toggle');
    if (toggle) {
      toggle.addEventListener('click', function (e) {
        e.preventDefault();
        var current = root.getAttribute('data-lang') === 'ko' ? 'ko' : 'en';
        setLang(current === 'ko' ? 'en' : 'ko', true);
      });
    }
  })();
</script>
