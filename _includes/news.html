<div class="well">
  <h4>News</h4>

  {% for article in site.data.news limit:3 %}
    <div style="text-align: justify; margin-bottom: 12px;">
      
      <span style="font-size: 1.05em; font-weight: bold;">{{ article.date }}</span>
      <br>
      
      {{ article.headline | markdownify | remove: '<p>' | remove: '</p>' }}
      
    </div>
  {% endfor %}

  <h4><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">... see all News</a></h4>
</div>
